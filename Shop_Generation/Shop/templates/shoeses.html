{% extends 'layout.html' %}

{% block title %}
    Shoes Page
{% endblock title %}

{% block content %}

<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: #f6f7f9;
    }

    /* Main container */
    .shoes_container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 25px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 25px;
    }

    /* Product Card */
    .staff_box {
        width: 340px;
        min-height: 450px;
        background: #ffffff;
        border: 1px solid #e5e7eb;
        border-radius: 16px;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        transition: all 0.3s ease;
        position: relative;
    }

    .staff_box:hover {
        transform: translateY(-8px);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.14);
    }

    /* Image */
    .shoe_image {
        width: 100%;
        height: 300px;
        overflow: hidden;
        background: #f1f3f5;
    }



    /* Product information */
    .shoe_info {
        padding: 18px;
    }

    .shoe_category {
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #888;
        margin-bottom: 7px;
    }

    .shoe_name {
        font-family: 'Times New Roman', Times, serif;
        font-size: 20px;
        font-weight: bold;
        color: #222;
        margin-bottom: 10px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .shoe_price {
        font-size: 21px;
        font-weight: bold;
        color: #111827;
        margin-bottom: 18px;
    }

    /* Button */
    .view_btn {
        display: block;
        width: 100%;
        padding: 11px 15px;
        background: #111827;
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 0.3px;
        transition: all 0.3s ease;
    }

    .view_btn:hover {
        background: #000000;
        color: white;
        transform: translateY(-2px);
    }

    /* New badge */
    .new_badge {
        position: absolute;
        top: 14px;
        left: 15px;
        background: #111827;
        color: white;
        padding: 6px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: bold;
        z-index: 2;
    }

    /* Responsive */
    @media (max-width: 768px) {
        .shoes_container {
            padding: 25px 15px;
            gap: 20px;
        }

        .staff_box {
            width: 260px;
        }

        .shoe_image {
            height: 230px;
        }
    }

    @media (max-width: 600px) {
        .staff_box {
            width: 100%;
            max-width: 320px;
        }
    }

    .pagination{
        display: flex;
        justify-content: center;
        list-style: none;
        padding: 0;
    }
    .pagination li a {
        padding: 15px 20px;
        border: 2px solid gray;
        border-radius: 5px;
        margin: 3px;
    }

    .pagination li a.active {
        background-color: #1e2139;
        text-decoration: none;
    }
</style>


<div class="shoes_container">

    {% for sh in list %}

    <div class="staff_box">

        <div class="new_badge">
            HOT
        </div>

        <div class="shoe_image">
            <img style="width: 100%; height: auto;" src="/media/{{ sh.photo }}" alt="{{ sh.names }}">
        </div>

        <div class="shoe_info">

            <div class="shoe_category">
                Shoes Collection
            </div>

            <div class="shoe_name">
                {{ sh.names }}
            </div>

            <div class="shoe_price">
                ${{ sh.price }}
            </div>

            <a class="view_btn" href="/shoeses_detail/{{ sh.id }}">
                View Product
            </a>

        </div>

    </div>

    {% endfor %}

</div>
    <ul class="pagination">
        <li><a href=""><i class="fa fa-arrow-left" aria-hidden="true"></i></a></li>
        <li><a href=""class="active">1</a></li>
        <li><a href=""class="active">2</a></li>
        <li><a href=""class="active">3</a></li>
        <li><a href=""><i class="fa fa-arrow-right" aria-hidden="true"></i></a></li>
    </ul>

{% endblock content %}
