{% extends 'layout.html' %}
    

{% block title %}  {{detail_dags.names}} {% endblock title %}
    
{% block content %}
<style>
     
    body{
      background-color: white;
    }
    .staff_box{
        width: 400px;
        height: 480px;
        border: 1px solid rgb(0, 0, 0);
        margin: 15px;
        float: left;
        overflow: hidden;
        
    }
    .staff_box img{
        width: 400px;
        height: 480px;
        object-fit: cover
    }
     .add-to-bag-btn {
            background-color: #1d1f17;
            color: #FFFFFF;            
            font-family: 'Arial', sans-serif; 
            font-size: 16px;         
            font-weight: bold;         
            letter-spacing: 2px;       
            border: 1px;             
            padding: 15px 40px;        
            width: 400px;             
            max-width: 500px;
            text-align: center;       
            cursor: pointer;          
            text-transform: uppercase; 
            display: flex;            
            justify-content: center;  
            align-items: center;       
            gap: 10px;
            margin-left: 5px;  
            margin-top: 220px;         
        }

        
        .add-to-bag-btn:hover {
            background-color: #393f2e; 
            color: #000000;
        }
    
   
</style>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <div class="staff_box">
 <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="/media/{{detail_bags.photo}}" class="d-block w-100" >
    </div>
    <div class="carousel-item">
      <img src="/media/{{detail_bags.photos}}" class="d-block w-100">
    </div>
    <div class="carousel-item">
      <img src="/media/{{detail_bags.photoback}}" class="d-block w-100">
    </div>
  </div>
    
</div>
    
</div>
     <div style="margin: 10px; font-size: 20px; ">
         
         <h2 class="feature-title" >{{detail_bags.names}}</h2><hr>
         <p class="feature-title" >{{detail_bags.name_model}}</p>
         <p>{{detail_bags.detail_bags}}</p><hr>
         <b><div style=" color: green;">{{detail_bags.price}}$</div></b>
    <button class="add-to-bag-btn">
      ADD TO BAG <span></span>{{detail_bags.price}}$
    </button>
     
      
    
{% endblock content %}
