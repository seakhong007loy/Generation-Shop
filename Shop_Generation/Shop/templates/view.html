{%block content %}
    <style>
        .image{
            border-radius: 5%;
        }
        .main{
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn h6{
            padding-left: 150px;
            padding-right: 150px;
        }
    </style>
    <div class="main">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

        <div style="width: 35%; float: left;">
            <div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="/media/{{view.front_photo}}" class="d-block w-100" alt="front_photo">
                    </div>
                    
                    <div class="carousel-item">
                        <img src="/media/{{view.back_photo}}" class="d-block w-100" alt="back_photo">
                    </div>
                </div>
            </div>
        </div>
        <div style="float: left; margin-left: 50px; padding-left: 25px; width: 50%;">

                <h4>{{view.names}}</h4>
                <br>

                <h4>${{view.price}}</h4>
                <br>
                
                <h5>Please select one color</h5>
                <ul class="pagination">   
                    <li class="page-item"><a style="background-color: rgb(0, 0, 0); border-radius: 5px; border: 1px solid black; margin-left: 10px; padding-left: 100px; padding-bottom: 120px;" class="page-link" href="#"></a></li>
                    <li class="page-item"><a style="background-color: rgb(255, 255, 255); border-radius: 5px; border: 1px solid black; margin-left: 10px; padding-left: 100px; padding-bottom: 120px;" class="page-link" href="#"></a></li>
                    <li class="page-item"><a style="background-color: rgb(255, 0, 0); border-radius: 5px; border: 1px solid black; margin-left: 10px; padding-left: 100px; padding-bottom: 120px;" class="page-link" href="#"></a></li>
                    <li class="page-item"><a style="background-color: rgb(68, 0, 255); border-radius: 5px; border: 1px solid black; margin-left: 10px; padding-left: 100px; padding-bottom: 120px;" class="page-link" href="#"></a></li>
                </ul>
                <br>

                <h5>Please select one size</h5>
                <nav aria-label="Page navigation example">
                    <ul class="pagination">
                        <li style="margin-left: 5px;" class="page-item"><a class="page-link" href="#">S</a></li>
                        <li style="margin-left: 5px;" class="page-item"><a class="page-link" href="#">M</a></li>
                        <li style="margin-left: 5px;" class="page-item"><a class="page-link" href="#">L</a></li>
                        <li style="margin-left: 5px;" class="page-item"><a class="page-link" href="#">XL</a></li>
                        <li style="margin-left: 5px;" class="page-item"><a class="page-link" href="#">XXL</a></li>
                    </ul>

                    <ul class="pagination"> 
                        <li class="btn btn-secondary" class="page-item"><h6> Add to Cart </h6></li>
                    </ul>
                </nav>
                
                <p style="color: rgb(84, 84, 84); margin-top:30px ;"><td>{{view.detail}}</td></p>
        </div>
    </div>
{% endblock content %}
